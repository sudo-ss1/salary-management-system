# Render blueprint: one web service running deploy/Dockerfile, plus a managed
# Postgres. Render reads this on "New > Blueprint" and provisions both, wiring
# the database connection string into the container as DATABASE_URL.
#
# Why one service rather than the three in docker-compose.yml: a free tier
# gives one container and one injected port. deploy/Dockerfile packages the
# Angular bundle and the Spring Boot jar together with nginx in front. The
# trade-off is written up in README's "Deploy it" section.

databases:
  - name: payscope-db
    databaseName: payscope
    user: payscope
    plan: free

services:
  - type: web
    name: payscope
    runtime: docker
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    plan: free

    # The API, not the SPA. nginx serves index.html the instant it starts, so a
    # health check on "/" would mark the service live while the JVM is still
    # booting and Flyway is still migrating - traffic would land on 502s. This
    # path only answers once the application is genuinely up and seeded.
    healthCheckPath: /api/analytics/summary

    envVars:
      # Render substitutes the managed database's libpq URL here.
      # deploy/entrypoint.sh splits it into the three SPRING_DATASOURCE_*
      # properties Spring expects.
      - key: DATABASE_URL
        fromDatabase:
          name: payscope-db
          property: connectionString

      # A container memory limit is not a JVM heap limit. The free instance has
      # 512 MB; without this the default heap sizing overcommits and the kernel
      # kills the process partway through seeding 10,000 employees.
      - key: JAVA_OPTS
        value: -XX:MaxRAMPercentage=70.0
