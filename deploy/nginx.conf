# Single-container variant of web/nginx.conf.
#
# docker-compose.yml runs the SPA and the API as two containers and nginx
# proxies across the compose network. A hosted free tier gives you one
# container and one injected port, so the same two processes share an image
# here: nginx owns $PORT and forwards /api to the JVM on loopback.
server {
    # Substituted from $PORT by deploy/entrypoint.sh. Render, Fly, Railway,
    # App Runner and Heroku all inject the port rather than letting the
    # container choose it, and a container that hardcodes 80 never passes
    # their health check.
    listen __PORT__;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The API is in this same container, so this is loopback rather than a
    # service name. Everything else about the contract is identical: the
    # built app calls /api/... on its own origin, which means no CORS
    # configuration and no API origin baked into the bundle at build time.
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A cold free-tier instance seeds 10,000 employees before it serves
        # anything; the default 60s read timeout can expire during that.
        proxy_read_timeout 120s;
    }

    # Single-page app: deep links (/employees/10001, /insights) and refreshes
    # must reach index.html so the Angular router can take over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
