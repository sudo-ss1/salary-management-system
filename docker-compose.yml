services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payscope
      POSTGRES_USER: payscope
      POSTGRES_PASSWORD: payscope
    # Not published to the host: api reaches db by service name over the
    # compose network, and nothing outside that network needs this port.
    # Publishing 5432 is also the single most common reason `docker compose
    # up` fails outright on a developer machine — most already run a
    # Postgres of their own on 5432.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payscope"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/payscope?reWriteBatchedInserts=true
      SPRING_DATASOURCE_USERNAME: payscope
      SPRING_DATASOURCE_PASSWORD: payscope
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/analytics/summary || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 40

  web:
    build: ./web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "4200:80"
