server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The built app calls /api/... on its own origin. proxy.conf.json only
    # rewrites requests for the Angular dev server (ng serve); this is the
    # equivalent for the production build served by this container.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Single-page app: unknown paths (deep links like /employees/10001 or
    # /insights, or a plain refresh on either) must fall back to index.html
    # so the Angular router can take over, instead of a 404 from nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
